scholarchain.entity-resolution {
  policy-version = "er-v1"
  accept-threshold = 0.93
  reject-threshold = 0.35
  unresolved-band-min = 0.65
  unresolved-band-max = 0.85
  blocking-key-fields = ["normalized_title", "surname_initial", "year"]
  feature-weights {
    title-jaccard = 0.30
    author-similarity = 0.25
    year-distance = 0.10
    venue-match = 0.10
    coauthor-overlap = 0.10
    orcid-match = 0.10
    affiliation-match = 0.05
  }
  llm {
    enabled = false
    prompt-version = "adjudication-v1"
    model-version = "stub"
    max-batch-size = 50
  }
}
