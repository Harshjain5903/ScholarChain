scholarchain {
  storage {
    s3-raw-bucket = "scholarchain-raw"
    s3-raw-bucket = ${?SCHOLARCHAIN_S3_RAW_BUCKET}
    s3-processed-bucket = "scholarchain-processed"
    s3-processed-bucket = ${?SCHOLARCHAIN_S3_PROCESSED_BUCKET}
    s3-vectors-bucket = "scholarchain-vectors"
    s3-vectors-bucket = ${?SCHOLARCHAIN_S3_VECTORS_BUCKET}
  }

  neptune {
    endpoint = "localhost"
    endpoint = ${?SCHOLARCHAIN_NEPTUNE_ENDPOINT}
    port = 8182
    port = ${?SCHOLARCHAIN_NEPTUNE_PORT}
    region = "us-east-2"
    region = ${?SCHOLARCHAIN_NEPTUNE_REGION}
  }

  # Contract for every ScholarChain S3 Vectors index (human decision 2026-11-22):
  # dimension 1024, cosine distance, populated by Amazon Titan Text Embeddings v2.
  # Validated at load time by AppConfig.load (dimensions 1..4096; metric cosine|euclidean).
  # Bucket and region live in scholarchain.storage.s3-vectors (storage module).
  # Removed 2026-11-22: `endpoint` and `index-name` (no callers; the single index
  # name matched none of the five real indexes).
  s3-vectors {
    dimensions = 1024
    dimensions = ${?SCHOLARCHAIN_S3_VECTORS_DIMENSIONS}
    distance-metric = "cosine"
    distance-metric = ${?SCHOLARCHAIN_S3_VECTORS_DISTANCE_METRIC}
    # Model that populated the indexes. Deliberately independent of
    # models.embedding-model-id (the query-time model) so the two can be compared;
    # a fallback model (e.g. Voyage) must never query or write a Titan index.
    embedding-model-id = "amazon.titan-embed-text-v2:0"
    embedding-model-id = ${?SCHOLARCHAIN_S3_VECTORS_EMBEDDING_MODEL_ID}
  }

  entity-resolution {
    blocking-key-fields = ["normalizedName", "year"]
    blocking-key-fields = ${?SCHOLARCHAIN_ER_BLOCKING_KEY_FIELDS}
    match-threshold = 0.85
    match-threshold = ${?SCHOLARCHAIN_ER_MATCH_THRESHOLD}
    reject-threshold = 0.3
    reject-threshold = ${?SCHOLARCHAIN_ER_REJECT_THRESHOLD}
    policy-version = "v1"
    policy-version = ${?SCHOLARCHAIN_ER_POLICY_VERSION}
  }

  retrieval {
    top-k = 10
    top-k = ${?SCHOLARCHAIN_RETRIEVAL_TOP_K}
    max-hops = 3
    max-hops = ${?SCHOLARCHAIN_RETRIEVAL_MAX_HOPS}
    min-score = 0.5
    min-score = ${?SCHOLARCHAIN_RETRIEVAL_MIN_SCORE}
    # Metric window used when a question names no years. MUST equal the Spark
    # metrics run's --window-start / --window-end (Neptune metrics are matched
    # to the window exactly). Validated at load: 1900..2100 and start <= end.
    # Defaults match the bounded runs.
    metric-window-start = 1980
    metric-window-start = ${?SCHOLARCHAIN_METRIC_WINDOW_START}
    metric-window-end = 2026
    metric-window-end = ${?SCHOLARCHAIN_METRIC_WINDOW_END}
  }

  # Legacy model section, kept for existing callers. The model IDs are derived
  # from the llm and embedding sections below, so each model ID has exactly one
  # default. `region` is the shared default for llm.region and embedding.region.
  models {
    embedding-model-id = ${scholarchain.embedding.model-id}
    generation-model-id = ${scholarchain.llm.model-id}
    region = "us-east-2"
    region = ${?SCHOLARCHAIN_MODELS_REGION}
  }

  # Runtime LLM (human decision 2026-11-24): Amazon Bedrock Claude Haiku 5.5
  # through the US geo inference profile. Approved fallback: Anthropic API.
  llm {
    # bedrock | anthropic
    provider = "bedrock"
    provider = ${?SCHOLARCHAIN_LLM_PROVIDER}
    model-id = "us.anthropic.claude-haiku-5-5"
    # Legacy env name, still honoured; SCHOLARCHAIN_LLM_MODEL_ID wins if both are set.
    model-id = ${?SCHOLARCHAIN_GENERATION_MODEL_ID}
    model-id = ${?SCHOLARCHAIN_LLM_MODEL_ID}
    region = ${scholarchain.models.region}
    region = ${?SCHOLARCHAIN_LLM_REGION}
    # Bounded: 1..64
    max-concurrent-calls = 4
    max-concurrent-calls = ${?SCHOLARCHAIN_LLM_MAX_CONCURRENT_CALLS}
    # Bounded: 1..8192
    max-output-tokens = 1024
    max-output-tokens = ${?SCHOLARCHAIN_LLM_MAX_OUTPUT_TOKENS}

    # Fallback provider credentials. REFERENCES ONLY, never key values.
    # Set at most one: a Secrets Manager ARN or the NAME of an env var.
    # Required when provider = "anthropic".
    anthropic {
      api-key-secret-arn = ""
      api-key-secret-arn = ${?SCHOLARCHAIN_ANTHROPIC_API_KEY_SECRET_ARN}
      api-key-env-var = ""
      api-key-env-var = ${?SCHOLARCHAIN_ANTHROPIC_API_KEY_ENV_VAR}
    }
  }

  # Query-time embeddings (human decision 2026-11-24): Amazon Titan Text
  # Embeddings v2, 1024 dimensions, us-east-2. Approved fallback: Voyage AI.
  # The index-populating model is s3-vectors.embedding-model-id (independent).
  embedding {
    # bedrock | voyage
    provider = "bedrock"
    provider = ${?SCHOLARCHAIN_EMBEDDING_PROVIDER}
    model-id = "amazon.titan-embed-text-v2:0"
    model-id = ${?SCHOLARCHAIN_EMBEDDING_MODEL_ID}
    # Defaults to the index dimension; must equal s3-vectors.dimensions
    # (validated at load time). Bounded: 1..4096.
    dimensions = ${scholarchain.s3-vectors.dimensions}
    dimensions = ${?SCHOLARCHAIN_EMBEDDING_DIMENSIONS}
    region = ${scholarchain.models.region}
    region = ${?SCHOLARCHAIN_EMBEDDING_REGION}

    # Fallback provider credentials. REFERENCES ONLY, never key values.
    # Required when provider = "voyage".
    voyage {
      api-key-secret-arn = ""
      api-key-secret-arn = ${?SCHOLARCHAIN_VOYAGE_API_KEY_SECRET_ARN}
      api-key-env-var = ""
      api-key-env-var = ${?SCHOLARCHAIN_VOYAGE_API_KEY_ENV_VAR}
    }
  }

  synthesis {
    # llm | extractive
    mode = "llm"
    mode = ${?SCHOLARCHAIN_SYNTHESIS_MODE}
  }

  operations {
    max-concurrency = 8
    max-concurrency = ${?SCHOLARCHAIN_MAX_CONCURRENCY}
    timeout-seconds = 30
    timeout-seconds = ${?SCHOLARCHAIN_TIMEOUT_SECONDS}
    retry-count = 3
    retry-count = ${?SCHOLARCHAIN_RETRY_COUNT}
  }
}
