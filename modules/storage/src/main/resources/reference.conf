scholarchain.storage {

  s3 {
    raw-bucket      = "scholarchain-raw"
    raw-bucket      = ${?SCHOLARCHAIN_S3_RAW_BUCKET}
    curated-bucket  = "scholarchain-curated"
    curated-bucket  = ${?SCHOLARCHAIN_S3_CURATED_BUCKET}
    graph-bucket    = "scholarchain-graph"
    graph-bucket    = ${?SCHOLARCHAIN_S3_GRAPH_BUCKET}
    rag-bucket      = "scholarchain-rag"
    rag-bucket      = ${?SCHOLARCHAIN_S3_RAG_BUCKET}
  }

  neptune {
    endpoint         = "localhost"
    endpoint         = ${?SCHOLARCHAIN_NEPTUNE_ENDPOINT}
    port             = 8182
    port             = ${?SCHOLARCHAIN_NEPTUNE_PORT}
    region           = "us-east-2"
    region           = ${?SCHOLARCHAIN_NEPTUNE_REGION}
    query-timeout-ms = 30000
    query-timeout-ms = ${?SCHOLARCHAIN_NEPTUNE_QUERY_TIMEOUT_MS}
  }

  dynamodb {
    region       = "us-east-2"
    region       = ${?SCHOLARCHAIN_DYNAMODB_REGION}
    table-prefix = "scholarchain"
    table-prefix = ${?SCHOLARCHAIN_DYNAMODB_TABLE_PREFIX}
  }

  s3-vectors {
    vector-bucket       = "scholarchain-vectors"
    vector-bucket       = ${?SCHOLARCHAIN_S3_VECTORS_BUCKET}
    region              = "us-east-2"
    region              = ${?SCHOLARCHAIN_S3_VECTORS_REGION}
    batch-size          = 100
    batch-size          = ${?SCHOLARCHAIN_S3_VECTORS_BATCH_SIZE}
    max-retries         = 3
    max-retries         = ${?SCHOLARCHAIN_S3_VECTORS_MAX_RETRIES}
    retry-base-delay-ms = 200
    retry-base-delay-ms = ${?SCHOLARCHAIN_S3_VECTORS_RETRY_BASE_DELAY_MS}
  }

  # SQS queue URL for embedding jobs (EmbeddingQueueManager). No default URL:
  # it is environment-specific and must come from SCHOLARCHAIN_EMBEDDING_QUEUE_URL
  # (set by Terraform). Blank means "not configured" and the queue manager refuses to start.
  embedding-queue-url = ""
  embedding-queue-url = ${?SCHOLARCHAIN_EMBEDDING_QUEUE_URL}

}
