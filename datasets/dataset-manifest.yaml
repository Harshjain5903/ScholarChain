    privacy_notes: >-
      Public bibliographic metadata released by dblp under CC0 1.0. The
      committed 50-record sample (datasets/samples/dblp/dblp-sample-50.xml)
      deliberately contains real titles, DBLP keys, author names as published
      in DBLP and public ORCID iDs. This is acceptable for a small CC0 sample.
      The full selections stay gitignored under datasets/derived/.
      No login-gated or restricted content is used.
    known_limitations:
      - "Selection bias from requiring a doi.org <ee>: the share of article/inproceedings records with a numeric year that pass all rules rises from 0.235 (1960) and 0.516 (1990) to 0.869 (2020) and 0.883 (2025). Older literature and venues without DOIs are under-represented (622,611 records fail on no_doi_org_ee)."
      - "Selection bias from requiring >= 2 authors: 1,026,155 records fail on this rule, so single-author work is excluded by design."
      - "Only article and inproceedings are eligible; books, chapters, theses and proceedings volumes are excluded."
      - "CoRR (arXiv) preprints are the largest venue: 6,633 of 50K and 1,306 of 10K. Their DOIs are 10.48550/arxiv.* (DataCite, not Crossref), so Crossref works/{doi} lookups will not resolve them."
      - "2026 is a partial year at this snapshot, and 2027 contains forthcoming-issue records (6,215 eligible). Proportional allocation reflects that."
      - "Year allocation is proportional to the DOI-eligible pool, not to all of DBLP."
      - "Author names are DBLP-disambiguated strings (homonym numbers), not global IDs; ORCID iDs are present only for some authors."
      - "Venue strings are DBLP abbreviations (e.g. 'IEEE Access', 'CoRR'); one selected inproceedings record has no booktitle."
      - "21 DOIs were shared by more than one eligible record (often '...a' key variants); only one record per DOI is kept."
