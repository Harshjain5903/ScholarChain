# ScholarChain Dataset Manifest
# Owner: dataset-engineer
# Schema version: 1.2.0
# Last updated: 2026-11-23 (Phase 13 dataset completion, step 1)
#
# Authoritative registry of datasets used by ScholarChain. Every dataset needs
# a complete entry with provenance and licence before any pipeline uses it.
# Values below are either observed/verified on disk or explicitly PENDING.
# Nothing in this file is an estimate presented as a fact.
#
# Machine-checked: every entry's `files:` list is verified offline by
#   /usr/bin/python3 -I -B datasets/scripts/validate_manifest.py
# (size, sha256, line counts, directory tree digests, JSON counts). Items with
# tracked: false are gitignored raw/derived data and report SKIP when absent
# (clean clone); tracked: true items are committed and must be present.
# Hashing: use /usr/bin/python3 -I (the pyenv 3.8.13 OpenSSL sha256 is broken;
# the scripts also fall back to the built-in _sha256 and reject any digest
# that is not 64 lowercase hex characters).
#
# Scale: the 10K and 50K selections are DEVELOPMENT runs. No reduced-final-scale
# approval exists; provider fallbacks require the human's instructor approval.

schema_version: "1.2.0"

datasets:

  - name: dblp
    status: "VERIFIED -- real snapshot present locally; selections built and validated 2026-11-22"
    purpose: >-
      Seed publication graph (titles, ordered authors, venues, years, DOIs).
      The DBLP 50K selection DOIs drive all other retrieval.
    source_urls:
      xml: "https://dblp.org/xml/dblp.xml.gz"
      dtd: "https://dblp.org/xml/dblp.dtd"
    documentation_url: "https://dblp.org/faq/16154937.html"
    license: "CC0 1.0 Public Domain Dedication"
    license_evidence: >-
      Quoted from the comment header of the downloaded dblp.dtd (sha256
      2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6):
      "The metadata provided by dblp on its webpages, as well as their XML,
      JSON, RDF, RIS, BibTeX, and text export formats available at our
      website, is released under the CC0 1.0 Public Domain Dedication
      license." The same header states "The dblp computer science
      bibliography is copyright by Schloss Dagstuhl - Leibniz Center for
      Informatics."
    reuse_terms: >-
      CC0 1.0: no permission or attribution legally required. dblp asks for a
      link to https://dblp.org as the source; ScholarChain cites it.
    snapshot_date: "2026-11-16"
    snapshot_date_evidence:
      gzip_header_mtime_utc: "2026-11-16T22:34:13Z"
      newest_record_mdate_observed: "2026-11-16"
    download_date: "2026-11-17"
    downloaded_by: "human architect (placed locally 2026-11-22)"
    local_raw_path: "datasets/raw/dblp/snapshot=2026-11-16/ (gitignored)"
    s3_raw_prefix: "s3://${RAW_BUCKET}/dblp/snapshot=2026-11-16/"
    retrieval_command: >-
      bash datasets/scripts/download-dblp.sh --i-understand-full-download
      --snapshot-date 2026-11-16   (never runs by default; skips without
      network when SHA256SUMS already verifies). Note: dblp.org/xml/dblp.xml.gz
      is the daily dump, so a later download yields a different snapshot.
    raw_files:
      - name: "dblp.xml.gz"
        size_bytes: 1120703993
        sha256: "082538149e7217dd51dbcc19d7b9d3c40193c9b0e6235fef61be7ca905cdfa8d"
        decompressed_size_bytes: 5408968366
      - name: "dblp.dtd"
        size_bytes: 13134
        sha256: "2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6"
        note: "DTD dated May 10, 2023 in its header; 65 general entity declarations"
    format: >-
      gzip-compressed XML, encoding ISO-8859-1 (declared), DOCTYPE
      <!DOCTYPE dblp SYSTEM "dblp.dtd">; non-ASCII text as named entities that
      resolve only with the local DTD.
    observed_record_type_counts:
      total: 13115316
      article: 4521786
      inproceedings: 4001570
      www: 4243328
      phdthesis: 158395
      incollection: 71264
      proceedings: 65862
      data: 31430
      book: 21654
      mastersthesis: 27
    eligibility:
      rule_order:
        - "type_not_article_or_inproceedings"
        - "key_missing"
        - "key_duplicate"
        - "title_empty"
        - "year_not_numeric"
        - "fewer_than_2_authors"
        - "no_doi_org_ee"
        - "doi_invalid"
      first_failing_reason_counts:
        type_not_article_or_inproceedings: 4591960
        key_missing: 0
        key_duplicate: 0
        title_empty: 0
        year_not_numeric: 3
        fewer_than_2_authors: 1026155
        no_doi_org_ee: 622611
        doi_invalid: 2
      eligible: 6874585
      doi_dedup:
        duplicate_doi_groups: 21
        records_in_duplicate_groups: 44
        records_removed: 23
        tie_rule: "keep the record with the smallest rank sha256(seed|key)"
      pool_after_doi_dedup: 6874562
      pool_years: "1938-2027 (86 distinct years)"
    selected_subset_rule: >-
      Eligible = article or inproceedings; key present and unique in the dump;
      non-empty title; numeric year; >= 2 authors; >= 1 <ee> that is an
      http(s)://[www.][dx.]doi.org/ URL whose canonical DOI (strip prefix,
      percent-decode, trim, lowercase) starts with "10." and has no whitespace.
      Reasons are evaluated in that order and the first failure is counted.
      Eligible records sharing a DOI keep only the smallest-rank record.
      Sizes are allocated over publication years in proportion to pool counts
      (largest remainder; ties by ascending year; 10K capped per year by the 50K
      allocation). Within each year the records with the smallest
      rank = sha256(seed + "|" + key) are taken. Not "first N". 10K is a subset
      of 50K (asserted and re-validated).
    selection_seed: "scholarchain-dblp-2026-11-16"
    selection_script: "datasets/scripts/dblp_select.py v1.0.0 (code version 7638fde+uncommitted at run time)"
    selection_command: >-
      python3 -I -B datasets/scripts/dblp_select.py
      --raw-dir datasets/raw/dblp/snapshot=2026-11-16
      --out-dir datasets/derived/dblp
