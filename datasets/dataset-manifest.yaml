      - label: "50k"
        records: 50000
        by_type: {article: 27554, inproceedings: 22446}
        distinct_years: 72
        year_range: "1956-2027"
        distinct_venues: 6263
        distinct_dois: 50000
        outputs:
          selection-50k.tsv: "dcbf947dcd3e61bfed34f510890501aa4e7c4a5345cae60bcf65632de1c5f7b8"
          selection-50k.dois.txt: "66777eac3917521611c05c0a516f551af1b34703f064e2ddb2f20404177d7a9d"
          selection-50k.xml: "79c02aa1c64fc83551b16020eb096beb9a4a02c4537cb66c24c88b7a4055f35f"
    derived_path: >-
      datasets/derived/dblp/ (gitignored): selection-{10k,50k}.{tsv,dois.txt,xml},
      dblp.dtd copy, eligible-index-summary.json, selection-summary.json
      (per-year allocation, by-year and by-venue distributions), and one
      <output>.provenance.json sidecar per output.
    sample:
      path: "datasets/samples/dblp/dblp-sample-50.xml"
      rule: "the 50 records of selection-10k with the smallest sha256(seed|key); original bytes, dump order"
      sha256: "1e968376f50084f1b8b731418b73aba0f77e72ce425a6603b2da063d16c481d4"
      size_bytes: 28312
      dtd_copy: "datasets/samples/dblp/dblp.dtd (sha256 2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6)"
      command: >-
        python3 -I -B datasets/scripts/dblp_sample.py --selection-dir
        datasets/derived/dblp --label 10k --n 50 --out
        datasets/samples/dblp/dblp-sample-50.xml
    incremental_update_strategy: >-
      Download a new dated snapshot with download-dblp.sh into its own
      snapshot=<date>/ directory, re-run dblp_select.py with the same seed,
      and diff selections by key. Snapshots are never overwritten in place.
    linkage_fields:
      - "key (dblp:<key>)"
      - "DOI (canonical, lowercase)"
      - "title"
      - "author (ordered; @orcid when present)"
      - "year"
      - "venue (journal | booktitle)"
    personal_data_notes: >-
      Author names exactly as published by DBLP, including DBLP homonym
      suffixes (e.g. "0001"), and public ORCID iDs carried as <author orcid="...">
      attributes (58,366 of 196,137 author occurrences in the 50K selection).
      No contact data.
    privacy_notes: >-
      Public bibliographic metadata released by dblp under CC0 1.0. The
      committed 50-record sample (datasets/samples/dblp/dblp-sample-50.xml)
      deliberately contains real titles, DBLP keys, author names as published
      in DBLP and public ORCID iDs. This is acceptable for a small CC0 sample.
      The full selections stay gitignored under datasets/derived/.
      No login-gated or restricted content is used.
    known_limitations:
      - "Selection bias from requiring a doi.org <ee>: the share of article/inproceedings records with a numeric year that pass all rules rises from 0.235 (1960) and 0.516 (1990) to 0.869 (2020) and 0.883 (2025). Older literature and venues without DOIs are under-represented (622,611 records fail on no_doi_org_ee)."
      - "Selection bias from requiring >= 2 authors: 1,026,155 records fail on this rule, so single-author work is excluded by design."
      - "Only article and inproceedings are eligible; books, chapters, theses and proceedings volumes are excluded."
      - "CoRR (arXiv) preprints are the largest venue: 6,633 of 50K and 1,306 of 10K. Their DOIs are 10.48550/arxiv.* (DataCite, not Crossref), so Crossref works/{doi} lookups will not resolve them."
      - "2026 is a partial year at this snapshot, and 2027 contains forthcoming-issue records (6,215 eligible). Proportional allocation reflects that."
      - "Year allocation is proportional to the DOI-eligible pool, not to all of DBLP."
      - "Author names are DBLP-disambiguated strings (homonym numbers), not global IDs; ORCID iDs are present only for some authors."
      - "Venue strings are DBLP abbreviations (e.g. 'IEEE Access', 'CoRR'); one selected inproceedings record has no booktitle."
      - "21 DOIs were shared by more than one eligible record (often '...a' key variants); only one record per DOI is kept."
    validation_commands:
      - "cd datasets/raw/dblp/snapshot=2026-11-16 && shasum -a 256 -c SHA256SUMS"
      - "/usr/bin/python3 -I -B -m unittest discover -s datasets/scripts/tests -v"
      - "/usr/bin/python3 -I -B datasets/scripts/validate_manifest.py"
      - "/usr/bin/python3 -I -B datasets/scripts/dblp_validate.py --out-dir datasets/derived/dblp --sample datasets/samples/dblp/dblp-sample-50.xml --sample-of 10k --sample-n 50"
      - "bash -n datasets/scripts/download-dblp.sh"
      - "bash datasets/scripts/download-dblp.sh --snapshot-date 2026-11-16   # expect SKIP (no network)"
    files:
      - {path: "datasets/raw/dblp/snapshot=2026-11-16/dblp.xml.gz", kind: file, tracked: false, size_bytes: 1120703993, sha256: "082538149e7217dd51dbcc19d7b9d3c40193c9b0e6235fef61be7ca905cdfa8d"}
