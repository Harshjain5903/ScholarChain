      percent-decode, trim, lowercase) starts with "10." and has no whitespace.
      Reasons are evaluated in that order and the first failure is counted.
      Eligible records sharing a DOI keep only the smallest-rank record.
      Sizes are allocated over publication years in proportion to pool counts
      (largest remainder; ties by ascending year; 10K capped per year by the 50K
      allocation). Within each year the records with the smallest
      rank = sha256(seed + "|" + key) are taken. Not "first N". 10K is a subset
