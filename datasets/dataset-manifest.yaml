  - name: crossref
    status: "FETCHED-WITH-GAPS -- 42,910 of 43,363 requested DOIs verified; 43 HTTP 301 (alias DOIs, retry list ready) and 410 HTTP 404 outstanding; reconciled 2026-11-23"
    purpose: >-
      Crossref works metadata (authors with ORCID iDs, references, container,
      dates) for the non-arXiv DOIs of the DBLP 50K development selection.
    source_urls:
      api: "https://api.crossref.org/works/{doi}"
    documentation_url: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/"
    license: "Crossref metadata -- Crossref states bibliographic metadata are facts free to reuse without restriction; abstracts may be publisher copyright (NOT re-verified online in this offline work order)"
    reuse_terms: >-
      Committed extracts drop abstracts, reference lists, licence and link
      blocks. The human must re-confirm the current Crossref metadata terms
      and REST API etiquette (polite pool via a contact address in the
      User-Agent) before redistribution beyond course use.
    spec_check: true
    license_status: "NEEDS-HUMAN-CONFIRMATION (web check of current Crossref metadata terms; not done offline)"
    human_confirmation_required:
      - "Confirm current Crossref metadata reuse terms and REST API etiquette at https://www.crossref.org/documentation/retrieve-metadata/rest-api/ before any redistribution beyond course use."
    format: "JSON, one verbatim API response envelope {status, message-type, message-version, message} per file (UTF-8, uncompressed), named <sha256(requested DOI)>.json"
    compression: "none (files stored uncompressed; S3 upload may add Content-Encoding gzip later)"
    schema_version: "Crossref REST API works message-version 1.0.0 (observed in every response envelope header)"
    expected_size: "43,363 requested DOIs (crossref-dois.txt) -> up to 43,363 files; expected bytes unknown before the crawl"
    observed_size: "42,910 files, 389,295,932 bytes (directory digest in files:); 453 requested DOIs have no file (43 HTTP 301, 410 HTTP 404)"
    s3_raw_prefix: "s3://${RAW_BUCKET}/crossref/retrieved=2026-11-22/"
    s3_upload_status: "NOT YET UPLOADED -- buckets are not deployed; intended prefix recorded"
    selected_subset_rule: >-
      The non-arXiv DOIs (prefix not 10.48550/) of the DBLP 50K development
      selection, in selection order (request_list below). Records are then
      classed per DOI by enrich_reconcile.py; only category "verified"
      (response DOI equals requested DOI) feeds the enrichment extract.
    incremental_update_strategy: >-
      Append-only dated directories: re-fetch gaps (retry list) with
      enrich_fetch.py crossref into retrieved=<date>/; files already parseable
      with status ok in any dated directory are skipped; nothing is overwritten
      in place; enrich_reconcile.py then takes the best state per DOI and
      enrich_extract.py regenerates the extract. No Crossref delta/index-date
      feed is used.
    linkage_fields:
      - "DOI (message.DOI, canonical lowercase) -> DBLP DOI / dblp_key"
      - "author[].ORCID (URL form) -> ORCID iD"
      - "author[].given + family + sequence -> DBLP author names (position)"
      - "container-title, ISSN -> DBLP venue"
      - "reference[].DOI -> citation edges to other works"
    personal_data_notes: >-
      Author given and family names and public ORCID iDs (28,223 author
      mentions carry one; 722 flagged authenticated-orcid). No emails or
      contact data in the retained fields.
    privacy_notes: >-
      Public bibliographic metadata as deposited by publishers. Raw responses
      (gitignored) keep everything Crossref returned, including reference lists
      and abstracts where deposited; the committed sample and the derived extract
      drop abstracts, references, licence and link blocks. Contact address is
      only used in the User-Agent and is never stored. HUMAN review needed if
      the data is ever published beyond course use.
    retrieval_date: "2026-11-22"
    retrieval_window_utc: "2026-11-22T20:25:18Z .. 2026-11-22T23:56:09Z (fetch log timestamps)"
    retrieved_by: "human architect, with a script outside the repository (curl without -L)"
    request_list:
      path: "datasets/derived/enrichment/crossref-dois.txt"
      rule: "selection-50k.dois.txt minus DOIs with prefix 10.48550/ (arXiv, DataCite-registered); byte-identical to that filtered list (sha256 d4027527dbdbfc0d773f94775ce0d49b8ebe2e9bd99a04869cf0078f7206edf2)"
      lines: 43363
    local_raw_path: "datasets/raw/crossref/retrieved=2026-11-22/<sha256(doi)>.json (gitignored); log datasets/raw/logs/crossref-2026-11-22.tsv (doi, http_status, utc, sha256(doi))"
    retrieval_command: >-
      Resumable, bounded re-fetch of the gaps (redirects followed manually and
      only to https api.crossref.org / api.openalex.org / pub.orcid.org, others
