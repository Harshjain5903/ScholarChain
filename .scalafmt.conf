version = 3.8.3
runner.dialect = scala3

maxColumn = 100
indent.main = 2
indent.callSite = 2
indent.defnSite = 2

align.preset = more
align.openParenCallSite = false
align.openParenDefnSite = false

newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]

rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]

docstrings.style = Asterisk
docstrings.oneline = keep

project.git = true
project.excludeFilters = [
  "target/"
]
